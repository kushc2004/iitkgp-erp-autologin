[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iitkgp-erp-autologin"
version = "1.0.0"
description = "One-command sign-in for the IIT KGP ERP portal with automatic Gmail OTP retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kushc2004" }]
keywords = ["iitkgp", "erp", "autologin", "sso", "kharagpur"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/kushc2004/iitkgp-erp-autologin"
Issues = "https://github.com/kushc2004/iitkgp-erp-autologin/issues"

[project.scripts]
erp-login = "erplogin.cli:main"

[tool.setuptools]
packages = ["erplogin"]
