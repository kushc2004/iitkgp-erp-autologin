<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>IIT KGP ERP Auto-Login</title>
    <style>
      body { min-width: 300px; font: 13px system-ui, sans-serif; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      button { padding: 7px 10px; cursor: pointer; border-radius: 6px;
               border: 1px solid #bbb; background: #f6f6f6; }
      button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      #log { background: #f4f4f4; border-radius: 6px; padding: 8px; margin-top: 10px;
             max-height: 150px; overflow-y: auto; font-family: ui-monospace, monospace;
             font-size: 11.5px; white-space: pre-wrap; display: none; }
      #log:not(:empty) { display: block; }
      #error { color: #b00; margin-top: 8px; display: none; }
      #error:not(:empty) { display: block; }
      .prompt { margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
      .prompt input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 6px; }
      .row { display: flex; gap: 6px; margin-bottom: 6px; }
      .row button { flex: 1; }
      details { margin-top: 12px; }
      summary { cursor: pointer; color: #555; }
      label { display: block; margin-top: 8px; color: #333; }
      label input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; }
      #saved { color: #2e7d32; margin-top: 6px; min-height: 1em; }
    </style>
  </head>
  <body>
    <h1>IIT KGP ERP Auto-Login</h1>

    <div class="row">
      <button id="signin" class="primary">Sign in to ERP</button>
      <button id="open" title="Open ERP without logging in">Open ERP</button>
    </div>

    <div id="prompt-answer" class="prompt" style="display:none">
      <strong>Security question:</strong>
      <div id="question-text"></div>
      <input id="answer-input" type="text" autocomplete="off"
             placeholder="Your answer - remembered after login succeeds">
      <button class="primary" style="width:100%;margin-top:6px" data-submit="answer">Submit answer</button>
    </div>

    <div id="prompt-otp" class="prompt" style="display:none">
      <strong>Enter the OTP</strong> from your inbox:
      <input id="otp-input" type="text" inputmode="numeric" maxlength="6"
             placeholder="6-digit code">
      <button id="check-now" style="width:100%;margin-top:6px">Mail arrived - check now</button>
      <button class="primary" style="width:100%;margin-top:6px" data-submit="otp">Submit OTP</button>
    </div>

    <div id="log"></div>
    <div id="error"></div>

    <details>
      <summary>Settings</summary>
      <label>Roll number
        <input id="roll" type="text" autocomplete="off">
      </label>
      <label>ERP password
        <input id="password" type="password">
      </label>
      <label>Gmail account index (usually 0)
        <input id="gmail" type="number" min="0" max="9">
      </label>
      <button id="save" style="width:100%;margin-top:10px">Save settings</button>
      <div id="saved"></div>
      <p style="font-size:11.5px;color:#777">
        OTP is read automatically from the Gmail feed of the account signed
        into this browser. Security answers are learned after successful
        logins. Keep-alive runs every 20 minutes while an ERP tab is open.
      </p>
    </details>

    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
